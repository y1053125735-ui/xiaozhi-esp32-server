$kind: http-request
url: "{{base_url}}/api/v1/ask"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: input_type
      value: audio
    - type: text
      key: output_type
      value: text
    - type: file
      key: audio
      src: test.wav
    - type: text
      key: audio_format
      value: wav
order: 3000
